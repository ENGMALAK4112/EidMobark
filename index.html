<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>عيد أضحى مبارك</title>

  <!-- الخط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- الألعاب النارية -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Reem Kufi', sans-serif;
    }

    body{
      overflow-x:hidden;
      background:black;
      color:white;
      min-height:100vh;
      position:relative;
    }

    /* الخلفية */
    .bg-main{
      position:fixed;
      inset:0;

      background:
      linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.75)),
      url('images/bg.jpg');

      background-size:cover;
      background-position:center;

      z-index:-5;
    }

    /* النجوم */
    .stars{
      position:fixed;
      inset:0;

      background-image:
      radial-gradient(white 1px, transparent 1px);

      background-size:50px 50px;

      opacity:.15;

      z-index:-4;

      animation:moveStars 40s linear infinite;
    }

    @keyframes moveStars{

      from{
        transform:translateY(0);
      }

      to{
        transform:translateY(-200px);
      }

    }

    /* الألعاب النارية */
    #tsparticles{
      position:fixed;
      inset:0;
      z-index:-3;
      pointer-events:none;
    }

/* ظهور المحتوى */
.hero{

  opacity:0;

  transform:
  scale(.7)
  translateY(-120px);

  animation:
  intro 2s ease forwards;

  animation-delay:1.5s;
}

    @keyframes intro{

      0%{
        opacity:0;

        transform:
        scale(.2)
        translateY(100px);

        filter:blur(15px);
      }

      60%{
        opacity:1;

        transform:
        scale(1.08)
        translateY(-10px);

        filter:blur(0);
      }

      100%{
        opacity:1;

        transform:
        scale(1)
        translateY(0);

        filter:blur(0);
      }

    }

    /* الصورة المتأرجحة */
    .hero-image{

      width:130px;

      animation:swing 4s ease-in-out infinite;

      transform-origin:top center;

      filter:
      drop-shadow(0 0 25px rgba(255,215,0,.45));

    }

    @keyframes swing{

      0%{
        transform:rotate(-8deg);
      }

      50%{
        transform:rotate(8deg);
      }

      100%{
        transform:rotate(-8deg);
      }

    }

    /* عنوان العيد */
    .eid-title{

      font-size:clamp(60px,9vw,140px);

      line-height:1.3;

      font-weight:700;

      background:
      linear-gradient(
      to bottom,
      #fff7d6,
      #f7d37b,
      #c89b3c);

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      text-shadow:
      0 0 25px rgba(255,215,0,.4);

      animation:glow 3s infinite alternate;
    }

    @keyframes glow{

      from{
        filter:drop-shadow(0 0 8px #d4af37);
      }

      to{
        filter:drop-shadow(0 0 25px #f5d06f);
      }

    }

    /* النص */
    .sub{

      color:#f5d06f;

      font-size:clamp(22px,3vw,40px);

      margin-top:10px;

      animation:
      pulse 3s infinite;
    }

    @keyframes pulse{

      0%,100%{
        opacity:1;
      }

      50%{
        opacity:.7;
      }

    }

    /* البطاقة */
    .card{

      background:rgba(0,0,0,.35);

      border:1px solid rgba(255,215,0,.2);

      backdrop-filter:blur(10px);

      box-shadow:
      0 0 35px rgba(255,215,0,.08);
    }

    /* الخروف */
    .sheep{
      width:220px;

      animation:
      bounce 3s infinite;

      filter:
      drop-shadow(0 0 25px rgba(255,215,0,.25));
    }

    @keyframes bounce{

      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-12px);
      }

    }

    /* الزر */
    .btn-gold{

      background:
      linear-gradient(to right,#c89b3c,#f5d06f);

      color:black;

      transition:.4s;
    }

    .btn-gold:hover{

      transform:
      translateY(-4px)
      scale(1.03);

      box-shadow:
      0 10px 25px rgba(255,215,0,.35);

    }

    /* الرسالة */
    .message{
      max-height:0;
      overflow:hidden;
      transition:1s;
    }

    .message.show{
      max-height:300px;
      margin-top:25px;
    }
    /* صورة الرسالة */
.message-image{

  width:120px;

  animation:
  floatMessage 3s ease-in-out infinite;

  filter:
  drop-shadow(0 0 20px rgba(255,215,0,.35));

}

/* حركة خفيفة */
@keyframes floatMessage{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

}
/* الفوتر */
.footer-name{

  margin-top:60px;

  text-align:center;

  font-size:clamp(18px,2vw,24px);

  font-weight:700;

  color:#f5d06f;

  letter-spacing:1px;

  animation:
  glowFooter 3s ease-in-out infinite,
  floatFooter 4s ease-in-out infinite;

  text-shadow:
  0 0 10px rgba(255,215,0,.5),
  0 0 20px rgba(255,215,0,.35),
  0 0 40px rgba(255,215,0,.2);

}

/* لمعة */
@keyframes glowFooter{

  0%,100%{

    opacity:1;

    text-shadow:
    0 0 10px rgba(255,215,0,.5),
    0 0 20px rgba(255,215,0,.35),
    0 0 40px rgba(255,215,0,.2);

  }

  50%{

    opacity:.8;

    text-shadow:
    0 0 20px rgba(255,215,0,.9),
    0 0 35px rgba(255,215,0,.6),
    0 0 60px rgba(255,215,0,.35);

  }

}

/* حركة ناعمة */
@keyframes floatFooter{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }

}

  </style>
</head>

<body>

  <!-- الخلفية -->
  <div class="bg-main"></div>

  <!-- النجوم -->
  <div class="stars"></div>

  <!-- الألعاب النارية -->
  <div id="tsparticles"></div>

  <!-- المحتوى -->
  <section class="min-h-screen flex justify-center px-6 py-20">

    <div class="hero max-w-8xl w-full text-center">

      <!-- الصورة المتأرجحة -->
      <div class="flex justify-center mb-8">

        <img
          class="hero-image"
          src="images/Sh2.png"
          alt="Eid"
        />

      </div>

      <!-- التهنئة -->
      <h1 class="eid-title">
        عيد أضحى مبارك
      </h1>

      <p class="sub">
        ✨ أعاده الله عليكم بالخير واليُمن والبركات ✨
      </p>

      <!-- البطاقة -->
      <div class="card rounded-[30px] p-8 md:p-12 mt-12">

        <p class="text-xl md:text-2xl leading-loose text-gray-200">

          تقبل الله منا ومنكم صالح الأعمال،
          وجعل أيامكم مليئة بالسعادة والطمأنينة،
          وكل عام وأنتم بخير 🤍

        </p>

        <!-- الخروف -->
        <div class="flex justify-center mt-10">

          <img
            class="sheep"
            src="images/sh1.png"
            alt="sheep"
          />

        </div>

        <!-- الزر -->
        <button
          onclick="showMessage()"
          class="btn-gold mt-10 px-8 py-4 rounded-full text-xl font-bold"
        >
          استقبال التهنئة ✨
        </button>

        <!-- الرسالة -->
        <div id="message" class="message">

          <div class="flex justify-center mt-8">

  <img
    class="message-image"
    src="images/sh3.png"
    alt="Eid Image"
  />

</div>

          <p class="mt-4 text-xl leading-loose text-gray-300">

            جعلكم الله من السعداء،
            وكتب لكم فرحة العيد،
            وأدام عليكم المسرات 🤍

          </p>

        </div>

      </div>

      <!-- الفوتر -->
      <div class="footer-name">
        تهنئة مقدمة من المهندسة ملاك محمد عبرين
      </div>

    </div>

  </section>

  <!-- الصوت -->

<audio id="bgMusic" loop>
  <source src="./audio/eid.mp3" type="audio/mpeg">
</audio>

<script>

const music = document.getElementById("bgMusic");

/* تشغيل الصوت أول ما يلمس المستخدم الصفحة */

document.addEventListener("click", () => {

  music.play();

}, { once:true });

</script>
  <script>

    function showMessage(){

      document
      .getElementById("message")
      .classList.toggle("show");

    }

    /* الألعاب النارية */

    if (window.tsParticles) {

  tsParticles.load("tsparticles", {

    fpsLimit:60,

    fullScreen:{
      enable:false
    },

    background:{
      color:"transparent"
    },

    particles:{

      number:{
        value:0
      },

      color:{
        value:[
          "#FFD700",
          "#ff4d6d",
          "#4cc9f0",
          "#ffffff",
          "#f72585"
        ]
      },

      shape:{
        type:"circle"
      },

      opacity:{
        value:1
      },

      size:{
        value:{
          min:2,
          max:4
        }
      },

      life:{
        duration:{
          sync:true,
          value:1.8
        },

        count:1
      },

      move:{

        enable:true,

        gravity:{
          enable:true,
          acceleration:10
        },

        speed:{
          min:10,
          max:30
        },

        decay:0.08,

        direction:"none",

        straight:false,

        outModes:{
          default:"destroy"
        }

      }

    },

    emitters:[

      {
        position:{
          x:20,
          y:80
        },

        rate:{
          delay:1.2,
          quantity:120
        }
      },

      {
        position:{
          x:50,
          y:30
        },

        rate:{
          delay:1.6,
          quantity:140
        }
      },

      {
        position:{
          x:80,
          y:70
        },

        rate:{
          delay:1.4,
          quantity:120
        }
      }

    ]

  });

}

  </script>

</body>
</html>
